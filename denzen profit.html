<style>
:root{
  --bg:#15121A;--sf:#1D1924;--sf2:#252030;--sf3:#2F2839;
  --hdr:rgba(21,18,26,.86);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --ink:#F4EEE6;--ink2:#D3CBDA;--mut:#9D93AA;
  --gold:#E6B85C;--gold2:#F2CD7E;--goldc:#B08A2C;--gold-dim:rgba(230,184,92,.14);
  --pos:#4FD1A1;--posc:#1F9A6E;--pos-dim:rgba(79,209,161,.14);
  --neg:#F2708A;--negc:#D9607B;--neg-dim:rgba(242,112,138,.14);
  --amber:#F1B35B;--btn-ink:#1a1206;
  --shadow:0 12px 34px rgba(0,0,0,.38);
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F1EFF4;--sf:#FFFFFF;--sf2:#F7F5FA;--sf3:#ECE8F2;
  --hdr:rgba(241,239,244,.88);
  --line:rgba(30,24,38,.09);--line2:rgba(30,24,38,.18);
  --ink:#1E1826;--ink2:#3E3549;--mut:#6F6680;
  --gold:#9A6B12;--gold2:#B07E1C;--goldc:#9A6B12;--gold-dim:rgba(154,107,18,.12);
  --pos:#137A58;--posc:#137A58;--pos-dim:rgba(19,122,88,.12);
  --neg:#C8324F;--negc:#C8324F;--neg-dim:rgba(200,50,79,.12);
  --amber:#B4700A;--btn-ink:#FFFFFF;
  --shadow:0 12px 34px rgba(30,24,38,.09);
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 380px at 50% -140px,var(--gold-dim),transparent 70%);z-index:0}
button{font:inherit;color:inherit}
.num,.v,.big,.hb-v,.p b,.val{font-variant-numeric:tabular-nums}
h1,h2,h3,.big,.serif{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.01em}
h2{font-size:19px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[hidden]{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:auto}
.brand img{width:36px;height:36px;flex:none}
.brand .t{font-family:'Fraunces',Georgia,serif;font-size:18px;line-height:1;font-weight:500}
.brand .s{font-size:11.5px;color:var(--mut);margin-top:3px}
.hbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sf);color:var(--ink2);display:grid;place-items:center;cursor:pointer;flex:none}
.hbtn svg{width:18px;height:18px}
.hbtn.on{color:var(--gold);border-color:var(--gold)}
#sync{font-size:11px;color:var(--mut);margin-right:2px}
.mnav{order:5;width:100%;display:flex;align-items:center;justify-content:center;gap:2px}
.mnav .pill{display:flex;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:999px;padding:2px;position:relative}
.mnav button{border:0;background:transparent;cursor:pointer;padding:7px 10px;border-radius:999px;color:var(--ink)}
.mnav .ml{font-weight:600;font-size:13.5px;min-width:120px;text-align:center}
.mnav input[type=month]{position:absolute;opacity:0;width:1px;height:1px;left:50%;top:50%}
@media(min-width:760px){.mnav{order:0;width:auto;margin-left:auto;margin-right:6px}.brand{margin-right:0}}

/* layout */
main{max-width:1120px;margin:0 auto;padding:16px 16px 0;position:relative;z-index:1}
.view{display:none}.view.on{display:block}
.grid2{display:grid;gap:22px}
@media(min-width:900px){.grid2{grid-template-columns:1.15fr 1fr;align-items:start}}
.sec{margin-top:26px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.sec-h p{font-size:13px;color:var(--mut)}
.link{background:none;border:0;color:var(--gold);font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0;white-space:nowrap}
.empty{padding:22px 0;color:var(--mut);font-size:14px}
.empty b{display:block;color:var(--ink);font-family:'Fraunces',serif;font-weight:500;font-size:18px;margin-bottom:4px}

/* hero split */
.hero{display:grid;grid-template-columns:1fr 1fr;background:var(--sf);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.hero>div{padding:20px 18px;min-width:0}
.hero>div+div{border-left:1px solid var(--line)}
.hero .k{color:var(--mut);font-size:13px;margin-bottom:6px}
.hero .big{font-size:clamp(21px,6.4vw,34px);line-height:1.1;white-space:nowrap}
.hero .sub{color:var(--mut);font-size:12.5px;margin-top:8px;line-height:1.4}
.hero .net{background:linear-gradient(160deg,var(--gold-dim),transparent 65%)}
.hero .net.pos .big{color:var(--pos)}.hero .net.neg .big{color:var(--neg)}
.hero .gross .big{color:var(--gold)}

/* gauge */
.gauge{margin-top:14px;background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.gauge-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gauge-h h2{font-size:17px}
.gauge .pct{font-family:'Fraunces',serif;font-size:28px;color:var(--gold);line-height:1}
.gauge .pct.over{color:var(--pos)}
.track{height:12px;border-radius:999px;background:var(--sf3);margin:12px 0 10px;overflow:hidden;position:relative}
.track .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--goldc),var(--gold2));transition:width .5s ease}
.track .fill.over{background:linear-gradient(90deg,var(--posc),var(--pos))}
.gauge-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2)}
.hint{margin-top:10px;font-size:12.5px;color:var(--mut);line-height:1.45}

/* ledger rows */
.lrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:12px}
.lrow .l{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:14px;flex:none;max-width:55%}
.lrow .op{width:16px;text-align:center;color:var(--mut);font-family:'Fraunces',serif;font-size:17px;flex:none}
.lrow .v{font-weight:600;font-size:15px;white-space:nowrap;text-align:right;min-width:0}
.lrow .v small{display:block;font-size:11.5px;color:var(--mut);font-weight:500;white-space:normal;line-height:1.35;margin-top:1px}
.lrow.total{border-bottom:0;padding-top:14px}
.lrow.total .l{color:var(--ink);font-weight:600;font-size:15px}
.lrow.total .v{font-family:'Fraunces',serif;font-size:23px;font-weight:500}
.lrow.sub-total .v{font-family:'Fraunces',serif;font-size:19px;font-weight:500}
.pos{color:var(--pos)}.neg{color:var(--neg)}.gold{color:var(--gold)}.mut{color:var(--mut)}
.lrow .v.mut{font-weight:500}

/* horizontal bars */
.hb{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hb-n{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-n small{display:block;font-size:11.5px;color:var(--mut)}
.hb-t{position:relative;height:10px;background:var(--sf3);border-radius:4px}
.hb-z{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--line2)}
.hb-f{position:absolute;top:0;bottom:0;border-radius:4px;transition:width .4s ease,left .4s ease}
.hb-f.pos{background:var(--posc)}.hb-f.neg{background:var(--negc)}.hb-f.gold{background:var(--goldc)}
.hb-v{font-weight:600;font-size:13.5px;min-width:86px;text-align:right}
.hb-v small{display:block;font-size:11px;color:var(--mut);font-weight:500}
.hb.click{cursor:pointer}

/* sale rows */
.srow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .m{font-weight:600;font-size:14.5px;line-height:1.3}
.srow .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.srow .p{text-align:right;white-space:nowrap;flex:none}
.srow .p b{display:block;font-size:15px}
.srow .p span{font-size:12px;color:var(--mut)}
.srow.ref{opacity:.6}.srow.ref .p b{text-decoration:line-through}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sf3);color:var(--ink2);margin:4px 6px 0 0;vertical-align:middle}
.chip.gold{background:var(--gold-dim);color:var(--gold)}.chip.neg{background:var(--neg-dim);color:var(--neg)}.chip.pos{background:var(--pos-dim);color:var(--pos)}
.acts{display:flex;gap:4px;margin-top:6px;justify-content:flex-end}
.ibtn{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:17px;height:17px}
.ibtn:hover{background:var(--sf3);color:var(--ink)}
.ibtn.danger:hover{color:var(--neg)}
.dgroup{display:flex;justify-content:space-between;align-items:baseline;margin-top:18px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.dgroup b{font-family:'Fraunces',serif;font-weight:500;font-size:16px}
.dgroup span{font-size:12.5px;color:var(--mut)}
.search{margin-top:12px}

/* forms */
.card{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:20px 18px}
.card.raised{box-shadow:var(--shadow)}
.card h2{margin-bottom:12px}
.card .d{font-size:13px;color:var(--mut);margin:-8px 0 14px}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--sf2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
input::placeholder{color:var(--mut);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--sf2);margin-bottom:16px;font-size:13.5px;color:var(--mut)}
.prev b{font-family:'Fraunces',serif;font-size:21px;font-weight:500;white-space:nowrap}
.btn{font-weight:600;font-size:15px;border:0;border-radius:14px;padding:14px 18px;cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(135deg,var(--gold2),var(--goldc));color:var(--btn-ink);width:100%}
.btn-ghost{background:var(--sf3);color:var(--ink2)}
.btn-danger{background:var(--neg-dim);color:var(--neg)}
.btn-sm{padding:10px 14px;font-size:13.5px;border-radius:11px;width:auto}
.row-acts{display:flex;gap:10px;margin-top:4px}
.row-acts .btn-ghost{width:auto}
.seg{display:inline-flex;background:var(--sf3);border-radius:11px;padding:3px;gap:2px}
.seg button{font-size:12.5px;font-weight:600;border:0;background:transparent;color:var(--mut);padding:7px 11px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--sf);color:var(--gold);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none;border:0;background:transparent;padding:4px 0}
.sw i{width:36px;height:21px;border-radius:999px;background:var(--sf3);border:1px solid var(--line2);position:relative;transition:.2s;flex:none}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--mut);transition:.2s}
.sw.on i{background:var(--goldc);border-color:var(--goldc)}.sw.on i::after{left:17px;background:#fff}

/* expense rows */
.xrow{display:grid;grid-template-columns:1fr 118px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.xrow input{padding:10px 12px;font-size:15px;border-radius:10px}
.xrow .dt{font-size:11.5px;color:var(--mut);grid-column:1/-1;margin-top:-4px}
.add-row{display:grid;grid-template-columns:1fr 118px auto;gap:8px;margin-top:12px;align-items:center}
.add-row input{padding:11px 12px;font-size:15px;border-radius:11px}
.prow{padding:12px 0;border-bottom:1px solid var(--line)}
.prow-h{display:flex;align-items:center;gap:10px}
.prow-h input{padding:9px 11px;font-size:15px;font-weight:600;border-radius:10px;background:transparent;border-color:transparent;min-width:0}
.prow-h input:focus{background:var(--sf2);border-color:var(--gold)}
.prow-b{display:flex;align-items:center;gap:16px;margin-top:8px;flex-wrap:wrap}
.prow-b .sal{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.prow-b .sal input{width:118px;padding:9px 11px;font-size:15px;border-radius:10px}
.prow.off .prow-h input{color:var(--mut);text-decoration:line-through}
.tot{display:flex;justify-content:space-between;padding:12px 0 2px;font-size:14px;color:var(--ink2)}
.tot b{font-family:'Fraunces',serif;font-weight:500;font-size:19px;color:var(--ink)}
.you-now{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gold-dim);font-size:13.5px;color:var(--ink2)}
.you-now b{color:var(--gold)}
.custom{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}

/* person box */
.pgrid{display:grid;gap:14px;align-items:start}
@media(min-width:900px){.pgrid{grid-template-columns:repeat(2,1fr)}}
.pbox{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:16px 16px 8px}
.pbox-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ava{width:44px;height:44px;border-radius:50%;background:var(--sf3);border:1.5px solid var(--gold);display:grid;place-items:center;font-family:'Fraunces',serif;font-size:17px;color:var(--gold);flex:none}
.pbox-h .n{font-weight:600;font-size:16px}.pbox-h .d{font-size:12.5px;color:var(--mut);margin-top:2px}
.pbox-h .net{margin-left:auto;text-align:right;flex:none}
.pbox-h .net b{display:block;font-family:'Fraunces',serif;font-size:23px;font-weight:500;line-height:1.1}
.pbox-h .net span{font-size:11.5px;color:var(--mut)}
.meter{display:flex;gap:4px;margin:12px 0 5px}
.meter i{flex:1;height:5px;border-radius:3px;background:var(--sf3);position:relative;overflow:hidden}
.meter i b{position:absolute;left:0;top:0;bottom:0;background:var(--goldc);border-radius:3px}
.meter-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:6px}
.wk{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:4px}
.wk span{font-size:11px;font-weight:600;padding:3px 7px;border-radius:7px;background:var(--sf3);color:var(--mut)}
.wk span.on{background:var(--gold-dim);color:var(--gold)}
.extra-in{display:flex;align-items:center;gap:6px}
.extra-in input{width:110px;padding:7px 10px;font-size:14px;border-radius:9px;text-align:right}
.pbox .lrow{padding:9px 0}
.pbox .lrow .l{font-size:13.5px}
.pbox .lrow .v{font-size:14px}

/* history */
.hist-wrap{overflow-x:auto;padding-bottom:6px;margin-top:8px}
.hist{height:232px;display:block}
.hist .gp{fill:var(--gold-dim);stroke:var(--goldc);stroke-width:1.5}
.hist .net{fill:var(--posc)}.hist .loss{fill:var(--negc)}
.hist .zero{stroke:var(--line2);stroke-width:1}
.hist .lbl{fill:var(--mut);font-size:11px;font-family:'Instrument Sans',sans-serif}
.hist .lbl.cur{fill:var(--gold);font-weight:700}
.hist .val{fill:var(--ink2);font-size:10.5px;font-weight:600;font-family:'Instrument Sans',sans-serif}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.legend .lg-gp{background:var(--gold-dim);border:1.5px solid var(--goldc)}.legend .lg-net{background:var(--posc)}.legend .lg-loss{background:var(--negc)}
.hrow{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:8px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;cursor:pointer;align-items:center}
.hrow.head{color:var(--mut);font-size:12px;cursor:default;padding:6px 0}
.hrow>:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.hrow b{font-family:'Fraunces',serif;font-weight:500;font-size:15px}
.hrow.cur b{color:var(--gold)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hdr);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;max-width:130px;font-size:11px;font-weight:600;border:0;background:transparent;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 4px;border-radius:12px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--gold)}
nav.tabs .addb{position:relative;top:-10px}
nav.tabs .addb i{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--goldc));color:var(--btn-ink);display:grid;place-items:center;box-shadow:0 8px 22px rgba(176,138,44,.4)}
nav.tabs .addb i svg{width:26px;height:26px;stroke-width:2.2}

/* modal + toast + login */
.ov{position:fixed;inset:0;background:rgba(10,8,14,.62);backdrop-filter:blur(4px);z-index:50;display:none;align-items:flex-end;justify-content:center;padding:16px}
.ov.on{display:flex}
@media(min-width:700px){.ov{align-items:center}}
.md{background:var(--sf);border:1px solid var(--line2);border-radius:22px;padding:22px 20px;width:100%;max-width:420px;box-shadow:var(--shadow)}
.md h3{font-size:21px;margin-bottom:8px}
.md p{color:var(--ink2);font-size:14px;margin-bottom:14px;line-height:1.5}
.md .macts{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
.md .macts .btn{width:auto}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--neg);color:#fff}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
#login::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at 50% 30%,var(--gold-dim),transparent 70%)}
#login .box{position:relative;width:100%;max-width:340px;text-align:center}
#login img{width:92px;height:92px;margin-bottom:16px;filter:drop-shadow(0 10px 26px rgba(236,106,23,.35))}
#login h1{font-size:32px;margin-bottom:2px}
#login .s{color:var(--mut);margin-bottom:24px;font-size:14px}
#login input{text-align:center;letter-spacing:.3em;font-size:20px;margin-bottom:12px}
#login .err{color:var(--neg);font-size:13px;min-height:18px;margin-top:10px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>

<script>
/* ================= CALC CORE (pure, testable) =================
   Pay structure = Denzen Sales Tracker (v41) minus WATI & Lead Control.
   - Basic salary per person (0 = "Nil": sirf commission, 1M se neeche bhi 2%)
   - Commission 2% of month revenue, locked below 10 lac (cliff)
   - Monthly bonus table from 13 lac
   - Weekly bonus (weeks 1–7, 8–14, 15–21, 22–28), unlocked at 15 lac,
     refund minus in the week the refund was processed
   - Extras (gift / dealing commission) optional per person per month
   - Yousuf: % of revenue (settable), charged against each person's revenue
*/
window.DZ=(function(){
  const PAY={
    COMM:0.02,COMM_UNLOCK:1000000,
    MONTHLY:[[1300000,9000],[1400000,12000],[1500000,15000],[1600000,18000],[1700000,21000],[1800000,32000],[1900000,37000],[2000000,40000],[2100000,49000],[2200000,52000],[2300000,55000],[2400000,64000],[2500000,67000],[2600000,70000],[2700000,79000],[2800000,82000],[2900000,85000],[3000000,94000]],
    MONTHLY_UNLOCK:1300000,
    WEEKLY_UNLOCK:1500000,
    WEEKLY_TIERS:[{min:350000,max:450000,b:4000},{min:450000,max:550000,b:7000},{min:550000,max:750000,b:10000},{min:750000,max:Infinity,b:16000}],
    WEEKS:[[1,7],[8,14],[15,21],[22,28]]
  };
  const pad2=n=>String(n).padStart(2,'0');
  function monthlyBonusFor(total){let b=0;for(const [min,amt] of PAY.MONTHLY){if(total>=min)b=amt;}return b;}
  function nextMonthlyStep(total){for(const [min,amt] of PAY.MONTHLY){if(total<min)return {min,amt};}return null;}
  function weekTier(w){return PAY.WEEKLY_TIERS.find(t=>w>=t.min&&w<t.max)||null;}
  function weekRanges(ym){return PAY.WEEKS.map(([d1,d2],i)=>({idx:i+1,d1,d2,from:ym+'-'+pad2(d1),to:ym+'-'+pad2(d2)}));}
  function weekNet(sales,w){
    let pos=0,neg=0;
    for(const s of sales){
      if(s.date>=w.from&&s.date<=w.to)pos+=(+s.price||0);
      if(s.refunded&&s.refundDate&&s.refundDate>=w.from&&s.refundDate<=w.to)neg+=(+s.price||0);
    }
    return pos-neg;
  }
  function personCalc(p,sales,ym,youPct,extra){
    const active=sales.filter(s=>!s.refunded);
    const refunded=sales.filter(s=>s.refunded);
    const revenue=active.reduce((a,s)=>a+(+s.price||0),0);
    const cost=active.reduce((a,s)=>a+(+s.cost||0),0);
    const gp=revenue-cost;
    const refundSum=refunded.reduce((a,s)=>a+(+s.price||0),0);
    const basic=Math.max(0,+p.basic||0);
    const nil=!!p.nil;
    const commission=revenue*PAY.COMM;
    const commUnlocked=nil||revenue>=PAY.COMM_UNLOCK;
    const commEarned=commUnlocked?commission:0;
    const mb=monthlyBonusFor(revenue);
    const weeks=weekRanges(ym).map(w=>{const wSales=weekNet(sales,w);const t=weekTier(wSales);return Object.assign({},w,{wSales,tier:t,bonus:t?t.b:0});});
    const weeklyUnlocked=revenue>=PAY.WEEKLY_UNLOCK;
    const weekPotential=weeks.reduce((a,w)=>a+w.bonus,0);
    const weekBonus=weeklyUnlocked?weekPotential:0;
    const extras=Math.max(0,+extra||0);
    const pay=basic+commEarned+mb+weekBonus+extras;
    const yousuf=revenue*(youPct/100);
    const net=gp-pay-yousuf;
    const margin=revenue>0?gp/revenue*100:0;
    return {id:p.id,name:p.name,active:p.active!==false,sales,activeSales:active,refunded,units:active.length,revenue,cost,gp,refundSum,
      basic,nil,commission,commUnlocked,commEarned,mb,nextMb:nextMonthlyStep(revenue),weeks,weeklyUnlocked,weekPotential,weekBonus,extras,pay,yousuf,net,margin,
      perUnit:active.length?net/active.length:0};
  }
  function extraOf(S,ym,pid){const e=((S.extras||{})[ym]||{})[pid];return e?(+e.amount||0):0;}
  function peopleList(S){return Object.entries(S.people||{}).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>((a.order||0)-(b.order||0))||String(a.name||'').localeCompare(String(b.name||'')));}
  function salesOf(S,ym){return Object.entries(((S.sales||{})[ym])||{}).map(([id,v])=>Object.assign({id,ym},v)).sort((a,b)=>(a.date<b.date?1:a.date>b.date?-1:0)||((b.createdAt||0)-(a.createdAt||0)));}
  function companyCalc(ym,S){
    const youPct=Math.max(0,Number((S.cfg&&S.cfg.you!=null)?S.cfg.you:3)||0);
    const salesAll=salesOf(S,ym);
    const people=peopleList(S);
    const rows=[];const seen=new Set();
    for(const p of people){
      const mine=salesAll.filter(s=>s.person===p.id);
      const act=p.active!==false;
      if(!act&&!mine.length)continue;
      seen.add(p.id);
      const basic=act?Math.max(0,+p.basic||0):0;
      rows.push(personCalc({id:p.id,name:p.name||'—',basic,nil:act&&basic===0,active:act},mine,ym,youPct,extraOf(S,ym,p.id)));
    }
    const orphans=salesAll.filter(s=>!seen.has(s.person));
    if(orphans.length)rows.push(personCalc({id:'_orphan',name:'Hataya gaya salesperson',basic:0,nil:false,active:false},orphans,ym,youPct,0));
    const sum=k=>rows.reduce((a,r)=>a+r[k],0);
    const revenue=sum('revenue'),cost=sum('cost'),gp=sum('gp'),units=sum('units'),refundSum=sum('refundSum');
    const refundCount=rows.reduce((a,r)=>a+r.refunded.length,0);
    const yousuf=revenue*(youPct/100);
    const basics=sum('basic'),payroll=sum('pay'),variablePay=payroll-basics;
    const commission=sum('commEarned'),mbonus=sum('mb'),wbonus=sum('weekBonus'),extras=sum('extras');
    const fixedItems=Object.entries(S.fixed||{}).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.order||0)-(b.order||0));
    const fixedStanding=fixedItems.reduce((a,f)=>a+(+f.amount||0),0);
    const mxItems=Object.entries(((S.monthExp||{})[ym])||{}).map(([id,v])=>Object.assign({id},v)).sort((a,b)=>(a.order||0)-(b.order||0));
    const monthExtra=mxItems.reduce((a,f)=>a+(+f.amount||0),0);
    const fixedTotal=fixedStanding+monthExtra;
    const burden=fixedTotal+basics;
    const contribution=gp-yousuf-variablePay;
    const net=contribution-burden;
    const coverage=burden>0?contribution/burden*100:(contribution>=0?100:0);
    const remaining=Math.max(0,burden-contribution);
    const margin=revenue>0?gp/revenue*100:0;
    const effMargin=revenue>0?(gp/revenue)-(youPct/100)-PAY.COMM:null;
    const beRevenue=(remaining>0&&effMargin!=null&&effMargin>0)?remaining/effMargin:null;
    const posSum=rows.reduce((a,r)=>a+(r.net>0?r.net:0),0);
    rows.forEach(r=>{r.share=posSum>0&&r.net>0?r.net/posSum*100:0;});
    return {ym,youPct,rows,sales:salesAll,revenue,cost,gp,units,refundSum,refundCount,yousuf,basics,variablePay,payroll,commission,mbonus,wbonus,extras,
      fixedItems,fixedStanding,mxItems,monthExtra,fixedTotal,burden,contribution,net,coverage,remaining,margin,effMargin,beRevenue};
  }
  function monthsWithData(S){const set=new Set([...Object.keys(S.sales||{}),...Object.keys(S.monthExp||{})]);return [...set].filter(k=>/^\d{4}-\d{2}$/.test(k)).sort();}
  return {PAY,monthlyBonusFor,nextMonthlyStep,weekTier,weekRanges,weekNet,personCalc,companyCalc,peopleList,salesOf,monthsWithData};
})();
</script>

/* ---------- helpers ---------- */

const MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>(n<0?'−Rs ':'Rs ')+Math.round(Math.abs(n)).toLocaleString('en-IN');
function trim(x){return x.replace(/\.?0+$/,'');}
const rsL=n=>Math.abs(n)>=100000?(n<0?'−':'')+'Rs '+trim((Math.abs(n)/100000).toFixed(2))+' L':rs(n);
const shortN=n=>{const a=Math.abs(n),s=n<0?'−':'';if(a>=100000)return s+trim((a/100000).toFixed(1))+'L';if(a>=1000)return s+Math.round(a/1000)+'k';return s+Math.round(a);};
const pct=n=>(Math.round(n*10)/10).toLocaleString('en-IN')+'%';
const fmtD=d=>d?(+d.slice(8,10))+' '+MON[+d.slice(5,7)-1]:'';
const fmtDL=d=>{if(!d)return'';const dt=new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10));return DOW[dt.getDay()]+', '+fmtD(d);};
const monthLabel=ym=>MONF[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const monthShort=ym=>MON[+ym.slice(5,7)-1]+' '+ym.slice(2,4);
const initials=n=>String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const sgn=n=>n>0?'pos':n<0?'neg':'';
function shiftMonth(ym,d){const [y,m]=ym.split('-').map(Number);const dt=new Date(y,m-1+d,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0');}
function sync(t){$('sync').textContent=t;}

/* toast */
let _tt=null;
function toast(msg,err){const t=$('toast');t.textContent=msg;t.className='toast on'+(err?' err':'');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),2400);}

/* modal */
function modal({title,body='',ok='OK',cancel='Cancel',danger=false,onOpen}){
  return new Promise(res=>{
    const ov=$('ov'),md=$('md');
    md.innerHTML=`<h3>${esc(title)}</h3>${body}<div class="macts"><button class="btn btn-ghost" id="md-c">${esc(cancel)}</button><button class="btn ${danger?'btn-danger':'btn-primary'}" id="md-o">${esc(ok)}</button></div>`;
    ov.classList.add('on');
    const close=v=>{ov.classList.remove('on');md.innerHTML='';res(v);};
    $('md-c').onclick=()=>close(false);
    $('md-o').onclick=()=>close(true);
    ov.onclick=e=>{if(e.target===ov)close(false);};
    if(onOpen)onOpen(md);
    setTimeout(()=>{const f=md.querySelector('input,select');(f||$('md-o')).focus();},30);
  });
}

  if($('pw').value.trim()===PASSWORD){sessionStorage.setItem('dz_np_ok','1');start();}

}

$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

function themeUI(){const l=document.documentElement.dataset.theme==='light';$('ic-sun').hidden=l;$('ic-moon').hidden=!l;document.querySelector('meta[name=theme-color]').content=l?'#F1EFF4':'#15121A';}

themeUI();

/* ---------- firebase ---------- */
function start(){
  $('login').style.display='none';
  $('f-date').value=today();
  bindForm();
  onValue(ref(db,ROOT),snap=>{
    const v=snap.val();
    if(!v){ if(!SEEDED){SEEDED=true;seed();} return; }
    S={cfg:Object.assign({you:3},v.cfg||{}),people:v.people||{},fixed:v.fixed||{},monthExp:v.monthExp||{},sales:v.sales||{},extras:v.extras||{}};
    LOADED=true;sync('synced');render();
  },err=>{sync('offline');toast('Firebase se connect nahi ho raha',true);console.error(err);});
}
function seed(){
  const people={};SEED_PEOPLE.forEach((n,i)=>{people['p'+(i+1)]={name:n,basic:30000,active:true,order:i+1,createdAt:Date.now()};});
  set(ref(db,ROOT),{cfg:{you:3},people}).catch(e=>{toast('Setup save nahi hua',true);console.error(e);});
}
async function w(fn,msg){try{await fn();if(msg)toast(msg);}catch(e){console.error(e);toast('Save nahi hua — internet check karein',true);}}

/* ---------- month nav ---------- */
function setMonth(ym){if(!/^\d{4}-\d{2}$/.test(ym))return;MONTH=ym;render();}
$('m-prev').onclick=()=>setMonth(shiftMonth(MONTH,-1));
$('m-next').onclick=()=>setMonth(shiftMonth(MONTH,1));
$('m-lbl').onclick=()=>{const i=$('m-in');i.value=MONTH;try{i.showPicker?i.showPicker():i.focus();}catch(e){i.focus();}};
$('m-in').onchange=e=>{if(e.target.value)setMonth(e.target.value);};

/* ---------- navigation ---------- */
function go(v){
  VIEW=v;
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  $('b-hist').classList.toggle('on',v==='hist');
  if(v!=='add'&&EDIT)cancelEdit(false);
  window.scrollTo({top:0});
  render();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('b-hist').onclick=()=>go(VIEW==='hist'?'dash':'hist');
$('b-share').onclick=shareSummary;

/* ---------- render ---------- */
function render(){
  $('m-lbl').textContent=monthLabel(MONTH);
  if(!LOADED)return;
  const C=DZ.companyCalc(MONTH,S);
  if(VIEW==='dash')renderDash(C);
  if(VIEW==='sales')renderSales(C);
  if(VIEW==='team')renderTeam(C);
  if(VIEW==='exp'){ if(document.activeElement&&$('v-exp').contains(document.activeElement)){EXP_DIRTY=true;} else renderExp(C); }
  if(VIEW==='hist')renderHist();
  fillPersonSelect();
}
$('v-exp').addEventListener('focusout',()=>{setTimeout(()=>{if(EXP_DIRTY&&!(document.activeElement&&$('v-exp').contains(document.activeElement))){EXP_DIRTY=false;renderExp(DZ.companyCalc(MONTH,S));}},60);});

function lrow(label,val,op,cls,sub){return `<div class="lrow"><div class="l">${op?`<span class="op">${op}</span>`:''}<span>${label}</span></div><div class="v ${cls||''}">${val}${sub?`<small>${sub}</small>`:''}</div></div>`;}

/* ===== DASHBOARD ===== */
function renderDash(C){
  const hasSales=C.units>0||C.refundCount>0;
  const netCls=C.net>0?'pos':C.net<0?'neg':'';
  const cov=Math.max(0,C.coverage);
  const covW=Math.min(100,cov);
  const hero=`
  <div class="hero">
    <div class="gross"><div class="k">Gross profit</div><div class="big">${rs(C.gp)}</div>
      <div class="sub">${hasSales?`${rsL(C.revenue)} sale<br>${C.units} laptop${C.units===1?'':'s'}, margin ${pct(C.margin)}`:'Abhi koi sale nahi'}</div></div>
    <div class="net ${netCls}"><div class="k">Net profit</div><div class="big">${rs(C.net)}</div>
      <div class="sub">${C.net>=0?'Sab kharche nikal kar':'Abhi nuqsaan — kharche poore nahi hue'}<br>Yousuf ${pct(C.youPct)} shamil</div></div>
  </div>
  <div class="gauge">
    <div class="gauge-h"><h2>Fixed kharche cover</h2><span class="pct ${cov>=100?'over':''}">${Math.round(cov)}%</span></div>
    <div class="track"><div class="fill ${cov>=100?'over':''}" style="width:${covW}%"></div></div>
    <div class="gauge-row"><span>${rs(Math.min(C.contribution,C.burden))} cover hue</span><span>${C.remaining>0?`${rs(C.remaining)} baaki (${Math.max(0,Math.round(100-cov))}%)`:'Poore cover — ab sab profit hai'}</span></div>
    <div class="hint">${C.burden===0?'Expense tab mein fixed kharche aur team ki basic salary add karein, phir ye gauge chalega.':
      C.remaining>0?(C.beRevenue?`Break-even tak andazan <b>${rsL(C.beRevenue)}</b> sale aur chahiye (abhi ke margin ${pct(C.margin)}, Yousuf ${pct(C.youPct)} aur 2% commission ke hisaab se).`:
      C.revenue>0?'Abhi ke margin par break-even mushkil hai — cost ya kharche dekhein.':`Fixed burden ${rs(C.burden)} hai (basic salaries + fixed + is mahine ke extra). Sale add karte jayein.`):
      `Fixed kharche ${rs(C.burden)} poore ho gaye — is ke upar har rupee net profit hai.`}</div>
  </div>`;

  const ledger=`
  <div class="sec">
    <div class="sec-h"><h2>Paisa kahan gaya</h2><p>${monthLabel(MONTH)}</p></div>
    ${lrow('Total sale',rs(C.revenue),'','',`${C.units} laptops${C.refundCount?`, ${C.refundCount} refund`:''}`)}
    ${lrow('Laptop cost',rs(C.cost),'−','mut')}
    <div class="lrow sub-total"><div class="l"><span class="op">=</span><span>Gross profit</span></div><div class="v gold">${rs(C.gp)}</div></div>
    ${lrow(`Yousuf ${pct(C.youPct)} <button class="link" onclick="A.go('exp')" style="font-size:12px;margin-left:4px">badlein</button>`,rs(C.yousuf),'−','mut')}
    ${lrow('Sales team pay',rs(C.payroll),'−','mut',`basic ${rs(C.basics)}${C.variablePay?`, commission &amp; bonus ${rs(C.variablePay)}`:''}`)}
    ${lrow('Fixed kharche',rs(C.fixedTotal),'−','mut',C.monthExtra?`${rs(C.fixedStanding)} fixed + ${rs(C.monthExtra)} extra`:'')}
    <div class="lrow total"><div class="l"><span class="op">=</span><span>Net profit</span></div><div class="v ${netCls}">${rs(C.net)}</div></div>
  </div>`;

  const team=`
  <div class="sec">
    <div class="sec-h"><h2>Team contribution</h2><button class="link" onclick="A.go('team')">Poori detail</button></div>
    ${C.rows.length?barsHTML(C.rows,'net',true):'<div class="empty"><b>Team khali hai</b>Expense tab mein salesperson add karein.</div>'}
  </div>`;

  const recent=`
  <div class="sec">
    <div class="sec-h"><h2>Taaza sales</h2>${C.sales.length?`<button class="link" onclick="A.go('sales')">Sab dekhein (${C.sales.length})</button>`:''}</div>
    ${C.sales.length?C.sales.slice(0,5).map(s=>saleRow(s,C,false)).join(''):`<div class="empty"><b>${monthLabel(MONTH)} mein abhi koi sale nahi</b>Add par jaa kar pehli sale likhein — cost, sale price aur salesperson.</div>`}
  </div>`;

  $('v-dash').innerHTML=`<div class="grid2"><div>${hero}${ledger}</div><div>${team}${recent}</div></div>`;
}

function barsHTML(rows,key,click){
  const vals=rows.map(r=>r[key]);
  const posMax=Math.max(0,...vals),negMax=Math.max(0,...vals.map(v=>-v));
  const span=(posMax+negMax)||1;const zero=negMax/span*100;
  return rows.map(r=>{
    const v=r[key];const wdt=Math.abs(v)/span*100;const left=v>=0?zero:zero-wdt;
    const cls=key==='net'?(v<0?'neg':'pos'):'gold';
    const vcls=key==='net'?sgn(v):'';
    return `<div class="hb ${click?'click':''}" ${click?`onclick="A.goPerson('${esc(r.id)}')"`:''}>
      <div class="hb-n">${esc(r.name)}<small>${r.units} laptop${r.units===1?'':'s'}</small></div>
      <div class="hb-t"><i class="hb-z" style="left:${zero}%"></i><b class="hb-f ${cls}" style="left:${left}%;width:${wdt}%"></b></div>
      <div class="hb-v ${vcls}">${rs(v)}${key==='net'&&r.share>0?`<small>${Math.round(r.share)}% share</small>`:''}</div></div>`;
  }).join('');
}

/* ===== HISTORY ===== */
function renderHist(){
  const months=DZ.monthsWithData(S);
  if(!months.includes(MONTH))months.push(MONTH);
  months.sort();
  const calcs=months.map(ym=>DZ.companyCalc(ym,S));
  const last=calcs.slice(-12);
  const svg=histSVG(last);
  const rows=[...calcs].reverse().map(c=>`<div class="hrow ${c.ym===MONTH?'cur':''}" onclick="A.openMonth('${c.ym}')"><b>${monthShort(c.ym)}</b><span>${rsL(c.revenue)}</span><span class="gold">${rsL(c.gp)}</span><span class="${sgn(c.net)}">${rsL(c.net)}</span></div>`).join('');
  $('v-hist').innerHTML=`<div class="grid2"><div>
    <div class="sec" style="margin-top:4px"><div class="sec-h"><h2>Mahina ba mahina</h2><p>aakhri ${last.length} mahine</p></div>
      <div class="hist-wrap" id="hist-wrap">${svg}</div>
      <div class="legend"><span><i class="lg-gp"></i>Gross profit</span><span><i class="lg-net"></i>Net profit</span><span><i class="lg-loss"></i>Loss</span></div>
    </div></div><div>
    <div class="sec" style="margin-top:4px"><div class="sec-h"><h2>Record</h2><p>tap karke mahina kholein</p></div>
      <div class="hrow head"><span>Mahina</span><span>Sale</span><span>Gross</span><span>Net</span></div>${rows}
    </div></div></div>`;
  const wrap=$('hist-wrap');if(wrap)wrap.scrollLeft=wrap.scrollWidth;
}
function histSVG(ms){
  if(!ms.length)return'';
  const bw=18,gap=4,gw=bw*2+gap,step=gw+26,padL=12,W=padL*2+ms.length*step,H=232,top=24,bot=44,ph=H-top-bot;
  const vals=ms.flatMap(m=>[m.gp,m.net]);let mx=Math.max(0,...vals),mn=Math.min(0,...vals);if(mx===mn){mx=mn+1;}
  const y=v=>top+(mx-v)/(mx-mn)*ph;const y0=y(0);
  let s=`<svg class="hist" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Mahina ba mahina gross aur net profit">`;
  s+=`<line x1="${padL}" x2="${W-padL}" y1="${y0}" y2="${y0}" class="zero"/>`;
  ms.forEach((m,i)=>{
    const x=padL+i*step+13;
    const r=(v,xx,cls)=>{const h=Math.abs(y(v)-y0);const yy=v>=0?y0-h:y0;return `<rect x="${xx}" y="${yy.toFixed(1)}" width="${bw}" height="${Math.max(h,v?1.5:0).toFixed(1)}" rx="3" class="${cls}"><title>${monthLabel(m.ym)}: ${cls==='gp'?'Gross':'Net'} ${rs(v)}</title></rect>`;};
    s+=r(m.gp,x,'gp')+r(m.net,x+bw+gap,m.net>=0?'net':'loss');
    s+=`<text x="${x+gw/2}" y="${H-10}" class="lbl ${m.ym===MONTH?'cur':''}" text-anchor="middle">${monthShort(m.ym)}</text>`;
    const vy=m.net>=0?Math.min(y(m.net),y(m.gp))-6:Math.min(y(m.net)+13,H-bot+12);
    s+=`<text x="${x+gw/2}" y="${vy.toFixed(1)}" class="val" text-anchor="middle">${shortN(m.net)}</text>`;
  });
  return s+'</svg>';
}

function fillPersonSelect(){

function preview(){
  const c=+$('f-cost').value||0,p=+$('f-price').value||0;const el=$('f-prev');
  if(!p){el.innerHTML='<span>Is laptop ka profit</span><b>—</b>';return;}
  const pr=p-c,m=pr/p*100;
  el.innerHTML=`<span>${pr<0?'Cost se kam — loss sale':'Is laptop ka profit'}<br><span style="font-size:12px">margin ${pct(m)}</span></span><b class="${sgn(pr)}">${rs(pr)}</b>`;
}
function bindForm(){
  ['f-cost','f-price'].forEach(id=>$(id).addEventListener('input',preview));
  $('f-save').onclick=saveSale;
  $('f-cancel').onclick=()=>cancelEdit(true);
  $('f-model').addEventListener('keydown',e=>{if(e.key==='Enter')$('f-specs').focus();});
  $('f-price').addEventListener('keydown',e=>{if(e.key==='Enter')saveSale();});
}
function clearForm(keep){
  if(!keep){$('f-date').value=today();}
  ['f-model','f-specs','f-cost','f-price','f-note'].forEach(id=>$(id).value='');
  preview();
}
async function saveSale(){
  const date=$('f-date').value,person=$('f-person').value,model=$('f-model').value.trim(),specs=$('f-specs').value.trim(),
        cost=+$('f-cost').value,price=+$('f-price').value,note=$('f-note').value.trim();
  if(!date||!/^\d{4}-\d{2}-\d{2}$/.test(date))return toast('Tareekh sahi nahi',true),$('f-date').focus();
  if(!person)return toast('Salesperson chunein',true),$('f-person').focus();
  if(!model)return toast('Laptop model likhein',true),$('f-model').focus();
  if(!(price>0))return toast('Sale price likhein',true),$('f-price').focus();
  if(!(cost>=0)||$('f-cost').value==='')return toast('Cost price likhein',true),$('f-cost').focus();
  if(cost>price){const ok=await modal({title:'Cost sale price se zyada hai',body:`<p>${rs(price-cost)} ka nuqsaan is laptop par. Phir bhi save karein?</p>`,ok:'Haan, save karein'});if(!ok)return;}
  const ym=date.slice(0,7);
  const data={date,person,model,specs,cost,price,note,createdAt:Date.now()};
  if(EDIT){
    const old=EDIT.sale;data.createdAt=old.createdAt||Date.now();
    if(old.refunded){data.refunded=true;data.refundDate=old.refundDate||today();}
    const id=EDIT.id,oldYm=EDIT.ym;
    await w(async()=>{await set(ref(db,`${ROOT}/sales/${ym}/${id}`),data);if(oldYm!==ym)await remove(ref(db,`${ROOT}/sales/${oldYm}/${id}`));},'Sale update ho gayi');
    cancelEdit(false);go('sales');return;
  }
  await w(()=>push(ref(db,`${ROOT}/sales/${ym}`),data),ym===MONTH?'Sale save ho gayi':`Sale ${monthLabel(ym)} mein save hui`);
  clearForm(true);$('f-model').focus();
}
function cancelEdit(goBack){
  EDIT=null;$('f-title').textContent='Nayi sale';$('f-sub').textContent='Sirf cost aur sale price — baaki hisaab khud ho jayega.';$('f-save').textContent='Sale save karein';$('f-editacts').hidden=true;clearForm(false);fillPersonSelect();
  if(goBack)go('sales');
}

    go('add');
    $('f-title').textContent='Sale edit';$('f-sub').textContent=`${esc(s.model)} — ${fmtD(s.date)}`;$('f-save').textContent='Changes save karein';$('f-editacts').hidden=false;
    fillPersonSelect();
    $('f-date').value=s.date;$('f-person').value=s.person;$('f-model').value=s.model||'';$('f-specs').value=s.specs||'';$('f-cost').value=s.cost;$('f-price').value=s.price;$('f-note').value=s.note||'';preview();
  },
  async refund(ym,id){
    const s=(S.sales[ym]||{})[id];if(!s)return;
    if(s.refunded){const ok=await modal({title:'Refund wapas lein?',body:`<p>${esc(s.model)} dobara sale mein shamil ho jayega.</p>`,ok:'Wapas lein'});if(!ok)return;
      return w(()=>update(ref(db,`${ROOT}/sales/${ym}/${id}`),{refunded:null,refundDate:null}),'Refund hata diya');}
    const ok=await modal({title:'Refund mark karein',body:`<p>${esc(s.model)} (${rs(s.price)}) sale aur cost se nikal jayega. Weekly bonus us hafte se minus hoga jis mein refund hua.</p><label class="f"><span>Refund ki tareekh</span><input type="date" id="rf-date" value="${today()}"></label>`,ok:'Refund karein',danger:true,onOpen:md=>{}});
    if(!ok)return;
    const rd=document.getElementById('rf-date');const refundDate=(rd&&rd.value)||today();
    w(()=>update(ref(db,`${ROOT}/sales/${ym}/${id}`),{refunded:true,refundDate}),'Refund mark ho gaya');
  },
  async delSale(ym,id){
    const s=(S.sales[ym]||{})[id];if(!s)return;
    const ok=await modal({title:'Sale delete karein?',body:`<p>${esc(s.model)} — ${rs(s.price)}. Ye wapas nahi aayegi. Agar customer ne wapas kiya hai to Refund use karein.</p>`,ok:'Delete',danger:true});
    if(ok)w(()=>remove(ref(db,`${ROOT}/sales/${ym}/${id}`)),'Sale delete ho gayi');
  },
  setExtra(pid,val){const amount=Math.max(0,+val||0);w(()=>amount?set(ref(db,`${ROOT}/extras/${MONTH}/${pid}`),{amount,updatedAt:Date.now()}):remove(ref(db,`${ROOT}/extras/${MONTH}/${pid}`)),'Extra save ho gaya');},
  youSel(v){if(v==='custom'){$('you-custom').hidden=false;$('you-in').focus();return;}A.setYou(+v);},
  youCustom(){A.setYou(+$('you-in').value);},
  setYou(v){if(!(v>=0&&v<=100))return toast('0 se 100 ke beech % likhein',true);w(()=>set(ref(db,`${ROOT}/cfg/you`),Math.round(v*100)/100),`Yousuf ${pct(v)} set`);},
  addPerson(){const name=$('np-name').value.trim();const basicRaw=$('np-basic').value;const basic=basicRaw===''?30000:Math.max(0,+basicRaw||0);if(!name)return toast('Naam likhein',true),$('np-name').focus();
    w(()=>push(ref(db,`${ROOT}/people`),{name,basic,active:true,order:Date.now(),createdAt:Date.now()}),`${name} add ho gaya`);},
  setPerson(id,field,val){const p=S.people[id];if(!p)return;
    if(field==='name'){const n=val.trim();if(!n)return render();return w(()=>update(ref(db,`${ROOT}/people/${id}`),{name:n}),'Naam update');}
    if(field==='basic'){const b=Math.max(0,+val||0);return w(()=>update(ref(db,`${ROOT}/people/${id}`),{basic:b}),b?`Basic ${rs(b)}`:'Basic Nil');}},
  toggleNil(id){const p=S.people[id];if(!p)return;const nil=(+p.basic||0)===0;w(()=>update(ref(db,`${ROOT}/people/${id}`),{basic:nil?(+p.prevBasic||30000):0,prevBasic:nil?null:(+p.basic||30000)}),nil?'Basic wapas':'Nil — sirf commission');},
  toggleActive(id){const p=S.people[id];if(!p)return;const act=p.active!==false;w(()=>update(ref(db,`${ROOT}/people/${id}`),{active:!act}),act?'Inactive — salary count nahi hogi':'Active');},
  async delPerson(id){const p=S.people[id];if(!p)return;
    const has=Object.values(S.sales||{}).some(m=>Object.values(m||{}).some(s=>s.person===id));
    if(has){const ok=await modal({title:`${p.name} ki sales record mein hain`,body:'<p>Record mehfooz rakhne ke liye delete nahi, Inactive kar dein — purane mahine sahi rahenge aur salary aage count nahi hogi.</p>',ok:'Inactive karein'});if(ok)w(()=>update(ref(db,`${ROOT}/people/${id}`),{active:false}),'Inactive kar diya');return;}
    const ok=await modal({title:`${p.name} ko hatayein?`,body:'<p>Is ki koi sale nahi hai, is liye poora record hat jayega.</p>',ok:'Hatayein',danger:true});
    if(ok)w(()=>remove(ref(db,`${ROOT}/people/${id}`)),'Hata diya');},
  addFixed(){const name=$('nf-name').value.trim(),amount=Math.max(0,+$('nf-amt').value||0);if(!name)return toast('Kharche ka naam likhein',true),$('nf-name').focus();if(!amount)return toast('Amount likhein',true),$('nf-amt').focus();
    w(()=>push(ref(db,`${ROOT}/fixed`),{name,amount,order:Date.now()}),'Fixed kharcha add');},
  setFixed(id,field,val){const f=S.fixed[id];if(!f)return;const v=field==='amount'?Math.max(0,+val||0):val.trim();if(field==='name'&&!v)return render();w(()=>update(ref(db,`${ROOT}/fixed/${id}`),{[field]:v}),'Update');},
  async delFixed(id){const f=S.fixed[id];if(!f)return;const ok=await modal({title:`${f.name} hatayein?`,body:'<p>Ye har mahine se hat jayega — purane mahine bhi is ke baghair dikhenge.</p>',ok:'Hatayein',danger:true});if(ok)w(()=>remove(ref(db,`${ROOT}/fixed/${id}`)),'Hata diya');},
  addMx(){const name=$('nx-name').value.trim(),amount=Math.max(0,+$('nx-amt').value||0);if(!name)return toast('Kharche ka naam likhein',true),$('nx-name').focus();if(!amount)return toast('Amount likhein',true),$('nx-amt').focus();
    w(()=>push(ref(db,`${ROOT}/monthExp/${MONTH}`),{name,amount,date:today(),order:Date.now()}),'Extra kharcha add');},
  setMx(id,field,val){const f=((S.monthExp||{})[MONTH]||{})[id];if(!f)return;const v=field==='amount'?Math.max(0,+val||0):val.trim();if(field==='name'&&!v)return render();w(()=>update(ref(db,`${ROOT}/monthExp/${MONTH}/${id}`),{[field]:v}),'Update');},
  async delMx(id){const f=((S.monthExp||{})[MONTH]||{})[id];if(!f)return;const ok=await modal({title:`${f.name} hatayein?`,ok:'Hatayein',danger:true});if(ok)w(()=>remove(ref(db,`${ROOT}/monthExp/${MONTH}/${id}`)),'Hata diya');}
};

/* ===== SHARE ===== */
async function shareSummary(){
  if(!LOADED)return;
  const C=DZ.companyCalc(MONTH,S);
  const lines=[`Denzen — ${monthLabel(MONTH)}`,`Sale: ${rs(C.revenue)} (${C.units} laptops)`,`Laptop cost: ${rs(C.cost)}`,`Gross profit: ${rs(C.gp)} (margin ${pct(C.margin)})`,`Yousuf ${pct(C.youPct)}: −${rs(C.yousuf).replace('Rs ','Rs ')}`,`Sales team pay: −${rs(C.payroll)}`,`Fixed kharche: −${rs(C.fixedTotal)}`,`Net profit: ${rs(C.net)}`,`Fixed cover: ${Math.round(Math.max(0,C.coverage))}%`,'',...C.rows.map(r=>`${r.name}: ${r.units} laptops, sale ${rs(r.revenue)}, net ${rs(r.net)}`)];
  const text=lines.join('\n');
  try{if(navigator.share){await navigator.share({title:'Denzen net profit',text});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text);toast('Summary copy ho gayi');}catch(e){await modal({title:'Summary',body:`<textarea rows="10" readonly style="font-size:13px">${esc(text)}</textarea>`,ok:'Theek hai',cancel:'Band'});}
}

/* ---------- boot ---------- */
if(sessionStorage.getItem('dz_np_ok')==='1')start();else setTimeout(()=>$('pw').focus(),100);
</script>
